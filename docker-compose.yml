  #     - traefik.http.routers.voice-assistant-frontend.entryPoints=websecure
  #     - traefik.http.routers.voice-assistant-frontend.tls.certresolver=letsencrypt
  #     - traefik.http.services.voice-assistant-frontend.loadbalancer.server.port=9002 # Port Nginx listens on *inside* this container
  #     - traefik.http.routers.voice-assistant-frontend.service=voice-assistant-frontend

# Define the network for inter-service communication
networks:
  voice-assistant-network:
    driver: bridge
