# Coolify-compatible docker-compose.yml
version: "3.8"

services:
  # Kokoro TTS API service (Audio Server - Now Exposed)
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: kokoro-tts # Optional, Coolify might override
    restart: unless-stopped
    networks:
      - voice-assistant-network
    # --- Coolify/Traefik Labels for nuc-voice ---
    labels:
      - traefik.enable=true
      # Define the hostname Traefik should listen for
      - traefik.http.routers.nuc-voice.rule=Host(`nuc-voice.inspectionapp.in`)
      # Use Coolify's standard HTTPS entry point (usually 'websecure')
      - traefik.http.routers.nuc-voice.entryPoints=websecure
      # Enable automatic HTTPS via Let's Encrypt (assuming configured in Coolify)
      - traefik.http.routers.nuc-voice.tls.certresolver=letsencrypt
      # Define the service Traefik should forward to
      - traefik.http.services.nuc-voice.loadbalancer.server.port=8880 # IMPORTANT: Verify this port! Check Kokoro-TTS docs/logs for the actual port it listens on inside the container. 8000 is common for FastAPI.
      # Link the router to the service
      - traefik.http.routers.nuc-voice.service=nuc-voice
    # ----------------------------------------------

  # Node.js backend for AI API proxying (Backend - Now Exposed)
  voice-assistant-backend:
    build:
      context: ./backend # Path relative to docker-compose.yml
      dockerfile: Dockerfile
    container_name: voice-assistant-backend # Optional
    restart: unless-stopped
    environment:
      # PORT the Node.js app listens on *inside* the container
      - PORT=9001
      # These will be injected by Coolify secrets
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4} # Provide a default if needed
    networks:
      - voice-assistant-network
    depends_on:
      - kokoro-tts
    # --- Coolify/Traefik Labels for nuc-backend ---
    labels:
      - traefik.enable=true
      # Define the hostname Traefik should listen for
      - traefik.http.routers.nuc-backend.rule=Host(`nuc-backend.inspectionapp.in`)
      # Use Coolify's standard HTTPS entry point
      - traefik.http.routers.nuc-backend.entryPoints=websecure
      # Enable automatic HTTPS
      - traefik.http.routers.nuc-backend.tls.certresolver=letsencrypt
      # Define the service Traefik should forward to (use the internal PORT)
      - traefik.http.services.nuc-backend.loadbalancer.server.port=9001
      # Link the router to the service
      - traefik.http.routers.nuc-backend.service=nuc-backend
    # ----------------------------------------------

  # Frontend web server for voice assistant (Commented Out - Reference Only)
  # voice-assistant-frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: voice-assistant-frontend
  #   restart: unless-stopped
  #   networks:
  #     - voice-assistant-network
  #   depends_on:
  #     - kokoro-tts
  #     - voice-assistant-backend
  #   labels:
  #     - traefik.enable=true
