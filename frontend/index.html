<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle Voice Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="speech-bot-container">
      <div class="speech-bot-header">
        <div class="header-title">Pickle Voice Assistant</div>
        <div class="model-selector">
          AI Model:
          <select id="model-select">
            <option value="openai" selected>ChatGPT</option>
            <option value="gemini">Gemini</option>
          </select>
        </div>
      </div>
      <div class="speech-bot-content">
        <div class="speech-bot-messages" id="messageContainer">
          <!-- Messages will appear here -->
        </div>
        <div class="speech-bot-controls">
          <div class="speech-bot-button">
            <button id="startRecording" class="recording-button">
              <span class="mic-icon">🎤</span>
              <span class="button-text">Hold to speak</span>
            </button>
            <div id="recordingStatus" class="recording-status">
              Tap microphone to start
            </div>
          </div>
          <div class="speech-bot-text-input">
            <form id="messageForm" class="speech-bot-text-input">
              <input
                type="text"
                id="textInput"
                placeholder="Type your message here..."
              />
              <button type="submit" id="sendButton">Send</button>
            </form>
          </div>
          <div class="speech-bot-tts">
            <label class="tts-toggle">
              <input type="checkbox" id="enableTTS" checked />
              <span>Text-to-Speech Output</span>
            </label>
            <div class="tts-settings" id="ttsSettings">
              <div class="tts-slider">
                <label for="tts-rate">Speed:</label>
                <input
                  type="range"
                  id="tts-rate"
                  min="0.5"
                  max="2"
                  value="1"
                  step="0.1"
                />
                <span id="tts-rate-value">1.0</span>
              </div>
              <div class="tts-slider">
                <label for="tts-pitch">Pitch:</label>
                <input
                  type="range"
                  id="tts-pitch"
                  min="0.5"
                  max="2"
                  value="1"
                  step="0.1"
                />
                <span id="tts-pitch-value">1.0</span>
              </div>
              <div class="tts-voice">
                <label for="tts-voice">Voice:</label>
                <select id="tts-voice"></select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
