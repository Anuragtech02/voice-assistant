<!-- Webflow embed code for Pickle Voice Assistant -->
<!-- Add this code to your Webflow site using the custom code embed element -->

<style>
  /* Container for the entire widget */
  .pickle-assistant-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
  }

  /* Button to open/close the assistant */
  .pickle-launcher {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: #0080ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 128, 255, 0.3);
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .pickle-launcher:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(0, 128, 255, 0.4);
  }

  /* Pickle icon */
  .pickle-icon {
    width: 32px;
    height: 32px;
  }

  /* The iframe container */
  .pickle-iframe-container {
    position: absolute;
    bottom: 75px;
    right: 0;
    width: 380px;
    height: 520px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transform: scale(0.9) translateY(20px);
    transform-origin: bottom right;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Active state for the iframe container */
  .pickle-iframe-container.active {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: all;
  }

  /* Close button */
  .pickle-close {
    display: none;
    color: white;
    font-size: 24px;
    font-weight: bold;
  }

  /* Iframe styling */
  .pickle-iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Animation for icon when clicked */
  @keyframes pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  .pulse {
    animation: pulse 0.5s ease-in-out;
  }
</style>

<div class="pickle-assistant-container">
  <!-- Launcher button with cute pickle icon -->
  <div class="pickle-launcher" id="pickle-launcher">
    <svg class="pickle-icon" viewBox="0 0 512 512" fill="#ffffff">
      <path
        d="M328.5,156.5c-10.4-33.8-40.9-57.5-76.3-57.5c-35.3,0-65.8,23.7-76.3,57.5H328.5z"
      />
      <path
        d="M397.5,178.3c-0.4-4.6-4.3-8.3-9-8.3H121.5c-4.7,0-8.6,3.6-9,8.3c-6.8,83.9,2.2,170.7,43.9,258.2
              c6.3,13.2,20.2,22,36.7,22h123.8c16.5,0,30.4-8.8,36.7-22C395.3,349,404.3,262.1,397.5,178.3z M339.7,415
              c-3.7,7.6-12.3,12.5-22.8,12.5H193.1c-10.5,0-19.1-4.9-22.8-12.5c-37.6-78.1-45.8-156.4-40.3-232.5h249.9
              C385.5,258.6,377.3,336.9,339.7,415z"
      />
      <path
        d="M256,338c-5,0-9,4-9,9v8c0,5,4,9,9,9s9-4,9-9v-8C265,342,261,338,256,338z"
      />
      <circle cx="214" cy="268" r="18" />
      <circle cx="298" cy="268" r="18" />
    </svg>
    <span class="pickle-close" id="pickle-close">×</span>
  </div>

  <!-- Iframe container that will expand -->
  <div class="pickle-iframe-container" id="pickle-iframe-container">
    <iframe
      src="https://nuc-bot.pages.dev/"
      class="pickle-iframe"
      id="pickle-iframe"
      frameborder="0"
      allow="microphone"
    ></iframe>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Elements
    const launcher = document.getElementById("pickle-launcher");
    const iframeContainer = document.getElementById("pickle-iframe-container");
    const pickleIcon = document.querySelector(".pickle-icon");
    const closeBtn = document.getElementById("pickle-close");

    // Replace with the actual URL where you've hosted the Pickle Assistant HTML
    const iframe = document.getElementById("pickle-iframe");

    // Toggle assistant visibility
    launcher.addEventListener("click", function () {
      if (iframeContainer.classList.contains("active")) {
        // Close assistant
        iframeContainer.classList.remove("active");
        pickleIcon.style.display = "block";
        closeBtn.style.display = "none";
      } else {
        // Open assistant
        iframeContainer.classList.add("active");
        pickleIcon.style.display = "block";
        closeBtn.style.display = "none";
        launcher.classList.add("pulse");

        // Remove animation class after animation completes
        setTimeout(() => {
          launcher.classList.remove("pulse");
        }, 500);
      }
    });

    // Close assistant when clicking outside
    document.addEventListener("click", function (event) {
      if (
        !iframeContainer.contains(event.target) &&
        !launcher.contains(event.target) &&
        iframeContainer.classList.contains("active")
      ) {
        iframeContainer.classList.remove("active");
      }
    });

    // Prevent clicks inside iframe from closing the assistant
    iframeContainer.addEventListener("click", function (event) {
      event.stopPropagation();
    });
  });
</script>
